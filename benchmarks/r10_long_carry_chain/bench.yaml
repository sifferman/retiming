id: r10
name: long_carry_chain
class: "C - classical unbalanced pipeline"
top: r10_long_carry_chain
latency_preserving: true
density_target: 0.55

description: |
  A three-level 32-bit adder tree is computed entirely in stage 1, stage 2 does one xor. Rebalancing requires moving a register across an adder, which forces the adder's OTHER operand to be delayed too.

constraints:
  asic:
    clock_period_ns: 0.861
    core_density: 0.55
    input_delay_frac: 0.15   # of clock period
    output_delay_frac: 0.15  # of clock period
    max_fanout: 20
    library: NangateOpenCellLibrary_typical (nangate45, primary)
    library_archived: gf180mcu_fd_sc_mcu9t5v0 (tt_025C_5v00)
  fpga:
    clock_period_ns: 4.0
    part: xc7a100tcsg324-1
    part_usplus: xcau7p-fcva289-1-e

variants:
  orig:      variants/orig
  retimed:   variants/retimed
  directive: variants/directive

primary_metric: fmax
expected: |
  Legal forward retiming, but the reference has to add a 32-bit register for operand e. This illustrates why retiming across multi-input operators costs registers -- and why a tool minimising register count will decline it.

id: r12
name: wide_reduction_tree
class: "C - classical unbalanced pipeline"
top: r12_wide_reduction_tree
latency_preserving: true
density_target: 0.55

description: |
  Sixty-four 8-bit values are summed by a full adder tree in stage 1; stage 2 does one xor. The fix pushes registers into the tree interior, registering four partial sums instead of one total.

constraints:
  asic:
    clock_period_ns: 0.916
    core_density: 0.55
    input_delay_frac: 0.15   # of clock period
    output_delay_frac: 0.15  # of clock period
    max_fanout: 20
    library: NangateOpenCellLibrary_typical (nangate45, primary)
    library_archived: gf180mcu_fd_sc_mcu9t5v0 (tt_025C_5v00)
  fpga:
    clock_period_ns: 4.0
    part: xc7a100tcsg324-1
    part_usplus: xcau7p-fcva289-1-e

variants:
  orig:      variants/orig
  retimed:   variants/retimed
  directive: variants/directive

primary_metric: fmax
expected: |
  Textbook forward retiming into a reduction tree. Both tools should manage it; included to measure how much period they recover versus the reference's clean four-way split.
